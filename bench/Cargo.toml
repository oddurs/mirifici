[package]
name = "mirifici-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Benchmarks for mirifici (separate workspace so its dev tooling does not affect the crate's MSRV)."

[workspace]

[dependencies]
mirifici = { path = ".." }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
logaddexp = "0.1.4"
logprob = "0.4.0"

[[bench]]
name = "ops"
harness = false

[profile.bench]
debug = false
