name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new toolchains and dependency releases.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path bench/Cargo.toml --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - name: site script parses
        run: node --check site/main.js

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features libm -- -D warnings
      - run: cargo clippy --all-targets --features serde,num-traits,approx,bytemuck -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml -- -D warnings

  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: stable, os: ubuntu-latest }
          - { toolchain: "1.85", os: ubuntu-latest }
          - { toolchain: beta, os: ubuntu-latest }
          - { toolchain: stable, os: macos-latest }
          - { toolchain: stable, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # The platform math library (the default), with every integration.
      - run: cargo test --features serde,num-traits,approx,bytemuck
      # The pure-Rust libm, including the cross-platform reproducibility hash.
      - run: cargo test --all-features
      - run: cargo test --no-default-features --features libm
      - run: cargo test --release --features serde,num-traits,approx,bytemuck --test robustness
      # --nocapture prints the per-platform accuracy table into the job log.
      - run: cargo test --release --test accuracy -- --nocapture
      - run: cargo test --release --features libm --test accuracy --test reproducible -- --nocapture
      - name: run examples (each checks its own results)
        shell: bash
        run: for e in hmm_forward likelihood briggs_table benford; do cargo run --release --example "$e"; done

  no-std:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv7em-none-eabihf, thumbv6m-none-eabi, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features libm
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features libm,serde,num-traits,approx,bytemuck

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # Every combination with a math library; without one the crate refuses to build.
      - run: cargo hack check --feature-powerset --at-least-one-of std,libm --no-dev-deps
      - run: cargo hack test --feature-powerset --at-least-one-of std,libm --lib --tests

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The crate's only unsafe code is the bytemuck impls; the integration and core
      # tests exercise them and the transparent layout. Default math backend: `libm`'s
      # fma detects the CPU with inline assembly, which Miri cannot run.
      - run: cargo miri test --features serde,num-traits,approx,bytemuck --test integrations --test core --test signed
        env:
          # Miri perturbs transcendental results by default; the tests check exact values.
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-deterministic-floats

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, format, arith]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz defaults to the musl target; fuzz on the host target.
      # One minute per target on every push; ten on the weekly schedule.
      - run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=${{ github.event_name == 'schedule' && 600 || 60 }}
        working-directory: fuzz

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --summary-only --fail-under-lines 95

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path bench/Cargo.toml --no-run

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
      - name: package contents
        run: |
          cargo package --list > "$RUNNER_TEMP/files.txt"
          ! grep -E '^(bench|fuzz|site|tools|\.github)/' "$RUNNER_TEMP/files.txt"

  minimal-versions:
    # Downstream lock files may hold the oldest versions Cargo.toml allows; build with them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack --remove-dev-deps
      - run: cargo update -Z direct-minimal-versions
      - run: cargo check --features serde,num-traits,approx,bytemuck
      - run: cargo check --no-default-features --features libm,serde,num-traits,approx,bytemuck
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo +1.85 check --features serde,num-traits,approx,bytemuck

  deny:
    # Licences, security advisories, banned and duplicate crates, and sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fixtures:
    # The committed references must be exactly what the generator produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/gen_fixtures.py
      - run: git diff --exit-code tests/fixtures

  semver:
    # On pull requests: no accidental breaking change to the public API.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks --baseline-rev origin/${{ github.base_ref }}
