# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Checked in CI (`deny` job) and runnable locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# Any RustSec advisory (vulnerability, unmaintained, unsound) fails the check.
yanked = "deny"

[licenses]
version = 2
# Permissive licences only, compatible with the crate's MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "Zlib", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
