[package]
name = "mirifici"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A log-space number type: products become sums, and magnitudes far beyond f64 stay representable."
license = "MIT OR Apache-2.0"
repository = "https://github.com/oddurs/mirifici"
documentation = "https://docs.rs/mirifici"
readme = "README.md"
keywords = ["logarithm", "log-space", "probability", "logsumexp", "no-std"]
categories = ["mathematics", "science", "no-std", "no-std::no-alloc"]
exclude = ["/.github", "/tools", "/bench", "/fuzz", "*.proptest-regressions"]

[features]
default = ["std"]
## Use the platform's math library through `std`. Without it, `libm` is used.
std = []
## `Serialize`/`Deserialize` for `Log` and `SignedLog`, and the `serde_as_value` module.
serde = ["dep:serde"]
## `Zero`, `One`, `Pow` and `Bounded` from `num-traits`.
num-traits = ["dep:num-traits"]
## `AbsDiffEq`, `RelativeEq` and `UlpsEq` from `approx`, on the stored log.
approx = ["dep:approx"]
## `Pod` and `Zeroable` from `bytemuck`.
bytemuck = ["dep:bytemuck"]

[dependencies]
libm = "0.2.8"
serde = { version = "1.0.100", optional = true, default-features = false }
num-traits = { version = "0.2.14", optional = true, default-features = false }
approx = { version = "0.5", optional = true, default-features = false }
bytemuck = { version = "1.7", optional = true, default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "warn"
return_self_not_must_use = "warn"
# Comparing floats exactly is the point of most assertions in a numerics crate.
float_cmp = "allow"
# Conversions between float widths and integer counts are deliberate and documented.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Formulas read best with the names used in the papers they come from.
many_single_char_names = "allow"
similar_names = "allow"
# Constants are copied digit-for-digit from high-precision references; separators would
# make them harder to check against the source.
unreadable_literal = "allow"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.100", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_test = "1.0.177"
